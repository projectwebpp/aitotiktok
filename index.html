<!DOCTYPE html>
<html>
<head>
    <title>TikTok OAuth Callback</title>
    <script>
        // 从 URL 获取授权码
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        
        if (error) {
            // 处理错误
            localStorage.setItem('tiktok_oauth_error', error);
            window.close();
        } else if (code && state) {
            // 发送回主窗口
            if (window.opener && typeof window.opener.handleTikTokCallback === 'function') {
                window.opener.handleTikTokCallback(code, state);
            }
            window.close();
        }
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px;">
        <h2>TikTok OAuth Callback</h2>
        <p>Processing authentication...</p>
    </div>
</body>
</html>
